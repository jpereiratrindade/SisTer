- schema: sister.engineering.maturity-check/1.0.0
  id: python-dependency-definition
  type: any_file_exists
  paths:
    - pyproject.toml
    - requirements.txt
  mandatory: true
  dimension: architecture
  stage: pre-alpha
  description: Definição de dependências do Python

- schema: sister.engineering.maturity-check/1.0.0
  id: streamlit-entrypoint
  type: any_file_exists
  paths:
    - app.py
    - streamlit_app.py
    - main.py
    - src/app.py
  mandatory: true
  dimension: architecture
  stage: pre-alpha
  description: Entrypoint do Streamlit

- schema: sister.engineering.maturity-check/1.0.0
  id: sister-integration-contract
  type: any_file_exists
  paths:
    - SISTER_INTEGRATION.md
    - contracts/system_manifest.json
    - contracts/subsystem-manifest.json
  mandatory: true
  dimension: contracts
  stage: pre-alpha
  description: Contrato de Integração

- schema: sister.engineering.maturity-check/1.0.0
  id: python-tests
  type: script
  script_ref: sister-clima.tests
  mandatory: true
  dimension: tests
  stage: pre-alpha
  description: Suíte de testes do Clima

- schema: sister.engineering.maturity-check/1.0.0
  id: python-import-check
  type: script
  script_ref: sister-clima.import-check
  mandatory: true
  dimension: tests
  stage: pre-alpha
  description: Teste de sanidade (import check)
