
- schema: sister.engineering.maturity-check/1.0.0
  id: build-definition
  stage: pre-alpha
  type: min_count
  mandatory: true
  description: Arquivos de build definidos (CMake ou Python/JS)
  arguments:
    dir: "."
    minimum: 1
    regex: ^(CMakeLists\.txt|pyproject\.toml|package\.json)$
- schema: sister.engineering.maturity-check/1.0.0
  id: integration-contract
  stage: pre-alpha
  type: file_exists
  mandatory: true
  description: Contrato de integração estrutural existe
  arguments:
    path: contracts/nexo_compras_integration.schema.json
