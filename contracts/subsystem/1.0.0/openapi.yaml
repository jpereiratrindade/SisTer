openapi: 3.1.0
info:
  title: SisTer Subsystem Technical Surface
  version: 1.0.0
paths:
  /manifest:
    get:
      summary: Return the approved subsystem manifest.
      responses:
        "200":
          description: Manifest
          content:
            application/json:
              schema:
                $ref: "./manifest.schema.json"
  /health:
    get:
      summary: Return sanitized process health.
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "./health.schema.json"
  /ready:
    get:
      summary: Return sanitized readiness for useful traffic.
      responses:
        "200":
          description: Readiness
          content:
            application/json:
              schema:
                $ref: "./readiness.schema.json"
  /capabilities:
    get:
      summary: Return implemented subsystem capabilities.
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "./capabilities.schema.json"
  /identity:
    get:
      summary: Return identity reconstructed by the SisTer trusted proxy.
      security:
        - sisterInternalProxy: []
      responses:
        "200":
          description: Mediated identity
          content:
            application/json:
              schema:
                $ref: "./identity.schema.json"
        "401":
          description: Trusted proxy authentication required
  /echo:
    post:
      summary: Execute the canonical functional round trip.
      security:
        - sisterInternalProxy: []
      responses:
        "200":
          description: Echo result
          content:
            application/json:
              schema:
                $ref: "./echo.schema.json"
        "400":
          description: Invalid payload
        "401":
          description: Trusted proxy authentication required
components:
  securitySchemes:
    sisterInternalProxy:
      type: apiKey
      in: header
      name: X-Sister-Proxy-Token
